[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/slint-studio-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "GPL-3.0-only"

[workspace.dependencies]
# Internal crates
slint-studio-core = { path = "crates/slint-studio-core" }
slint-studio-lsp = { path = "crates/slint-studio-lsp" }
slint-studio-preview = { path = "crates/slint-studio-preview" }
slint-studio-compiler = { path = "crates/slint-studio-compiler" }

# GUI shell. Pinned to egui 0.36: egui_dock and egui-phosphor do not support 0.37 yet.
eframe = "0.36.2"
egui = "0.36.2"
egui_dock = "0.21.1"
egui-phosphor = "0.14.0"
egui_kittest = "0.36.2"
fontdb = "0.23"

# Language server client and slint-lsp provisioning
lsp-types = "0.97"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2.5"
ureq = { version = "3.5", default-features = false, features = ["rustls", "platform-verifier", "gzip"] }
flate2 = "1"
tar = { version = "0.4", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate"] }
sha2 = "0.11"
directories = "6"

# Live preview. Pinned to the same Slint version as the managed slint-lsp.
# `internal-highlight` (element geometry for the designer) is not a stable
# Slint API: it is used only in slint-studio-preview/src/geometry.rs.
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "renderer-software"] }
slint-interpreter = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "renderer-software", "image-default-formats", "internal-highlight"] }
image = { version = "0.25", default-features = false }
notify = "8"

# Build and run: `.slint` checks with the Slint compiler (same version as the
# interpreter, so it adds no compile time) and stopping process groups on Unix.
i-slint-compiler = { version = "=1.18.1", default-features = false }
nix = { version = "0.31", default-features = false, features = ["signal"] }

# Native dialogs
rfd = "0.18"

# Testing
tempfile = "3"

# Errors & diagnostics
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
egui_extras = "0.36.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Production code must not panic on recoverable errors (see clippy.toml for tests).
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "warn"
todo = "warn"

# Keep debug builds of the UI responsive: optimise dependencies, not our crates.
# Dependencies carry no debug info, which keeps `target/` several times smaller
# (Slint is large); our own crates keep full debug info.
[profile.dev.package."*"]
opt-level = 2
debug = false
